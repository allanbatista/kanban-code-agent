services:
  kanban:
    build: .
    image: kanban-code-agent
    container_name: kanban-code-agent
    restart: unless-stopped
    init: true # PID 1 = tini, colhe zumbis dos processos codex reparentados
    ports:
      - '35000:35000'
    env_file: .env
    environment:
      # Pinned here (not in .env) so the volume mount below always matches.
      SWARM_DATA_DIR: /data
    volumes:
      - ./data:/data
      # SWARM_ISOLATION=docker spawns worker containers via `docker run`. To use
      # it FROM this deployed container, mount the host Docker socket below.
      # WARNING: this grants the container full control of the host Docker daemon
      # (effectively root on the host) — only enable it if you accept that risk.
      #- /var/run/docker.sock:/var/run/docker.sock
